# JCD Foundation — Netlify config
# Static site (plain HTML) with a site-wide branded password gate
# served by an edge function before any static file reaches the browser.

[build]
  publish = "."

[[edge_functions]]
  function = "gate"
  path = "/*"

# /meet was the original printed URL; the meet content now lives at the root.
# These redirects keep any already-distributed cards/letters working.
[[redirects]]
  from = "/meet"
  to = "/"
  status = 301

[[redirects]]
  from = "/meet.html"
  to = "/"
  status = 301

# The April concept form lived at /apply-full until Oct 2026; the real
# application (built from Bob's spec) is /apply. The concept is archived
# at /apply-concept.
[[redirects]]
  from = "/apply-full"
  to = "/apply"
  status = 301

[[redirects]]
  from = "/apply-full.html"
  to = "/apply"
  status = 301

# Short sector URLs printed as QR codes on the Oct 2026 sector flyers.
# 302 (temporary) on purpose: until applications open Dec 1 they land on the
# matching What We Fund section; on Dec 1 retarget them (e.g. to /apply)
# without reprinting a single flyer.
[[redirects]]
  from = "/manufacturing"
  to = "/what-we-fund#manufacturing"
  status = 302

[[redirects]]
  from = "/health"
  to = "/what-we-fund#health"
  status = 302

[[redirects]]
  from = "/trades"
  to = "/what-we-fund#trades"
  status = 302
