# JCD Foundation — Netlify config
# Static site (plain HTML) with a site-wide branded password gate
# served by an edge function before any static file reaches the browser.

[build]
  publish = "."

[[edge_functions]]
  function = "gate"
  path = "/*"

# /meet was the original printed URL; the meet content now lives at the root.
# These redirects keep any already-distributed cards/letters working.
[[redirects]]
  from = "/meet"
  to = "/"
  status = 301

[[redirects]]
  from = "/meet.html"
  to = "/"
  status = 301

# The April concept form lived at /apply-full until Oct 2026; the real
# application (built from Bob's spec) is /apply. The concept is archived
# at /apply-concept.
[[redirects]]
  from = "/apply-full"
  to = "/apply"
  status = 301

[[redirects]]
  from = "/apply-full.html"
  to = "/apply"
  status = 301
